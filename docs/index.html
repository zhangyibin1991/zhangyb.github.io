<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhangyb's homepage</title>
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        
        /* Minimalist Color Palette */
        :root {
            --primary-color: #222;
            --secondary-color: #333;
            --accent-color: #4a90e2;
            --background-color: #fff;
            --border-color: #eee;
            --card-bg-color: #fafafa;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            line-height: 1.6;
            color: var(--primary-color);
            background-color: var(--background-color);
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 30px;
            flex: 1;
        }
        
        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            padding: 60px 20px;
            margin-bottom: 40px;
            gap: 40px;
        }
        
        .hero-content {
            flex: 6; /* 60% width */
        }
        
        .hero-profile {
            flex: 4; /* 40% width */
            height: 360px; /* Fixed height to match left text content */
            border-radius: 0;
            object-fit: cover;
            margin: 0;
            border: none;
        }
        
        .image-meta {
            font-size: 0.75em;
            color: #999;
            margin-top: 12px;
            text-align: center;
            line-height: 1.4;
            width: 100%;
        }
        
        .hero-name {
            font-size: 6em;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: -0.03em;
            text-align: left;
        }
        
        .hero-title {
            font-size: 1em;
            color: var(--secondary-color);
            margin-bottom: 25px;
            font-weight: 300;
            text-align: left;
        }
        
        .hero-intro {
            font-size: 2em;
            max-width: 600px;
            margin: 0;
            line-height: 1.6;
            color: var(--primary-color);
            text-align: left;
        }
        
        /* Hide other sections on small screens for hero page effect */
        /* Removed to ensure all sections are visible on narrow screens */
        
        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 30px;
        }
        
        h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 300;
        }
        
        .tagline {
            font-size: 1.1em;
            color: var(--secondary-color);
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        .intro {
            font-size: 1.05em;
            text-align: center;
            max-width: 700px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }
        
        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }
        
        .profile-pic:hover {
            transform: scale(1.03);
        }
        
        section {
            margin-bottom: 60px;
        }
        
        h2 {
            font-size: 1.7em;
            padding-bottom: 15px;
            color: var(--primary-color);
            font-weight: 300;
            letter-spacing: -0.02em;
        }
        
        h3 {
            font-size: 1.3em;
            color: var(--primary-color);
            margin-top: 25px;
            font-weight: 400;
        }
        
        .hobby-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .hobby-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            background-color: var(--card-bg-color);
            transition: all 0.3s ease;
        }
        
        .hobby-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        
        .hobby-card h3 {
            margin-top: 0;
        }
        
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }
        
        .skill-tag {
            background-color: var(--card-bg-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9em;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .skill-tag:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        /* Blog Article List Styles */
        .blog-list {
            margin-top: 30px;
        }
        
        .blog-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: border-bottom-color 0.2s ease;
        }
        
        .blog-item:hover {
            border-bottom-color: var(--primary-color);
        }
        
        .blog-item:last-child {
            border-bottom: none;
        }
        
        .blog-date {
            color: #666;
            font-size: 0.9em;
            white-space: nowrap;
            min-width: 90px;
        }
        
        .blog-title {
            color: var(--primary-color);
            font-size: 1em;
            font-weight: 400;
            line-height: 1.5;
        }
        
        
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            color: var(--secondary-color);
            font-size: 0.9em;
            padding-bottom: 30px;
        }
        
        /* Enhanced Responsive Design */
        @media (max-width: 1024px) {
            .container {
                padding: 40px 25px;
            }
            
            .hobby-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 25px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .hobby-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .hobby-card {
                padding: 25px;
            }
            
            /* Hero section specific styles */
            .hero {
                padding: 40px 15px;
                margin-bottom: 30px;
                flex-direction: column;
                text-align: center;
            }
            
            .hero-image-container {
                order: 1;
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin-bottom: 20px;
            }
            
            .hero-content {
                order: 2;
                margin-top: 0;
            }
            
            .hero-profile {
                margin: 0;
                height: 360px; /* Keep the same height on mobile */
            }
            
            .image-meta {
                margin-top: 12px;
            }
            
            .hero-name {
                font-size: 2.2em;
            }
            
            .hero-title {
                font-size: 1.1em;
            }
            
            .hero-intro {
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            h2 {
                font-size: 1.5em;
            }
            
            .profile-pic {
                width: 120px;
                height: 120px;
            }
            
            /* Hero section specific styles */
            .hero {
                padding: 30px 10px;
                margin-bottom: 25px;
            }
            
            .hero-name {
                font-size: 2em;
            }
            
            .hero-title {
                font-size: 1em;
            }
            
            .hero-intro {
                font-size: 1em;
            }
        }
    </style>
    <script>
        // GSAP Animations
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize GSAP animations
            initGSAPAnimations();
        });
        
        function initGSAPAnimations() {
            // Initialize ScrollTrigger
            gsap.registerPlugin(ScrollTrigger);
            
            // Refresh ScrollTrigger on window resize
            window.addEventListener('resize', () => {
                ScrollTrigger.refresh();
            });
            
            // Hero section entrance animation
            // Animate the hero content and profile image separately
            gsap.from('.hero-content', {
                duration: 1,
                x: -50,
                opacity: 0,
                ease: 'power3.out'
            });
            
            gsap.from('.hero-image-container', {
                duration: 1,
                x: 50,
                opacity: 0,
                ease: 'power3.out',
                delay: 0.2
            });
            
            // Animate elements within hero content
            gsap.from('.hero-name', {
                duration: 1,
                y: 30,
                opacity: 0,
                ease: 'power3.out',
                delay: 0.3
            });
            
            gsap.from('.hero-title', {
                duration: 1,
                y: 30,
                opacity: 0,
                ease: 'power3.out',
                delay: 0.5
            });
            
            
            // Hobby card animations
            gsap.utils.toArray('.hobby-card').forEach((card, i) => {
                gsap.from(card, {
                    scrollTrigger: {
                        trigger: card,
                        start: 'top 85%',
                        toggleActions: 'play none none reverse'
                    },
                    duration: 0.6,
                    y: 40,
                    opacity: 0,
                    ease: 'power2.out',
                    delay: i * 0.1
                });
            });
            
            // Blog list item animations
            gsap.utils.toArray('.blog-item').forEach((item, i) => {
                gsap.from(item, {
                    scrollTrigger: {
                        trigger: item,
                        start: 'top 90%',
                        toggleActions: 'play none none reverse'
                    },
                    duration: 0.5,
                    x: -20,
                    opacity: 0,
                    ease: 'power2.out',
                    delay: i * 0.05
                });
            });
        }
    </script>
</head>
