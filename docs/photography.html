<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影作品 - Y.B.ZHANG</title>
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        
        /* Minimalist Color Palette - Same as main page */
        :root {
            --primary-color: #222;
            --secondary-color: #333;
            --accent-color: #4a90e2;
            --background-color: #fff;
            --border-color: #eee;
            --card-bg-color: #fafafa;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            line-height: 1.6;
            color: var(--primary-color);
            background-color: var(--background-color);
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 30px;
            flex: 1;
        }
        
        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 300;
        }
        
        .tagline {
            font-size: 1.1em;
            color: var(--secondary-color);
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        .subtitle {
            font-size: 1em;
            color: var(--accent-color);
            font-weight: 400;
        }
        
        /* Photography Grid */
        .photography-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-top: 40px;
        }
        
        /* Responsive grid columns */
        @media (max-width: 1200px) {
            .photography-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 900px) {
            .photography-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .photography-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .photo-card {
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-color: var(--accent-color);
        }
        
        .photo-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.9em;
        }
        
        .photo-info {
            padding: 20px;
        }
        
        .photo-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        
        .photo-meta {
            font-size: 0.85em;
            color: var(--secondary-color);
            margin-bottom: 12px;
        }
        
        .photo-description {
            font-size: 0.9em;
            color: var(--secondary-color);
            line-height: 1.5;
        }
        
        /* Category Filter */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 8px 20px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        
        .category-btn:hover,
        .category-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--secondary-color);
        }
        
        .empty-state h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        
        /* Footer */
        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 40px;
            color: var(--secondary-color);
            font-size: 0.9em;
            padding-bottom: 40px;
            border-top: 1px solid var(--border-color);
        }
        
        /* Modal for Image View */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        
        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }
        
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .photography-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .photo-image {
                height: 200px;
            }
            
            .category-filter {
                gap: 10px;
            }
            
            .category-btn {
                padding: 6px 15px;
                font-size: 0.85em;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 15px;
            }
            
            h1 {
                font-size: 1.7em;
            }
            
            .photography-grid {
                grid-template-columns: 1fr;
            }
            
            .photo-image {
                height: 180px;
            }
        }
    </style>
    <script>
        // Sample photography data
        const photographyData = [
            {
                id: 1,
                title: "城市夜景",
                category: "城市",
                date: "2024.12",
                description: "繁华都市的霓虹灯光，展现现代生活的节奏与韵律。",
                image: "🌃"
            },
            {
                id: 2,
                title: "山间晨雾",
                category: "自然",
                date: "2024.11",
                description: "清晨的薄雾笼罩山峦，宛如仙境般的宁静时刻。",
                image: "⛰️"
            },
            {
                id: 3,
                title: "海岸线",
                category: "风景",
                date: "2024.10",
                description: "碧海蓝天，海浪拍打着礁石，展现大自然的壮阔。",
                image: "🌊"
            },
            {
                id: 4,
                title: "街头人文",
                category: "人文",
                date: "2024.09",
                description: "记录城市街头的日常瞬间，捕捉生活的温度。",
                image: "👥"
            },
            {
                id: 5,
                title: "建筑几何",
                category: "建筑",
                date: "2024.08",
                description: "现代建筑的线条与结构之美，展现几何学的艺术感。",
                image: "🏛️"
            },
            {
                id: 6,
                title: "日落余晖",
                category: "风景",
                date: "2024.07",
                description: "夕阳西下，天空被染成金红色的壮丽景象。",
                image: "🌅"
            }
        ];
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            renderPhotography();
            initGSAPAnimations();
            setupCategoryFilter();
        });
        
        // Render photography grid
        function renderPhotography(filterCategory = '全部') {
            const container = document.getElementById('photography-grid');
            if (!container) return;
            
            let filteredData = photographyData;
            if (filterCategory !== '全部') {
                filteredData = photographyData.filter(item => item.category === filterCategory);
            }
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>暂无作品</h3>
                        <p>该分类下暂无摄影作品</p>
                    </div>
                `;
                return;
            }
            
            const html = filteredData.map(item => `
                <div class="photo-card" data-category="${item.category}">
                    <div class="photo-image">${item.image}</div>
                    <div class="photo-info">
                        <div class="photo-title">${item.title}</div>
                        <div class="photo-meta">${item.category} · ${item.date}</div>
                        <div class="photo-description">${item.description}</div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
            
            // Add click handlers for modal
            setTimeout(() => {
                const cards = document.querySelectorAll('.photo-card');
                cards.forEach((card, index) => {
                    card.addEventListener('click', () => openModal(filteredData[index]));
                });
                
                // Animate new cards
                gsap.utils.toArray('.photo-card').forEach((card, i) => {
                    gsap.from(card, {
                        scrollTrigger: {
                            trigger: card,
                            start: 'top 85%',
                            toggleActions: 'play none none reverse'
                        },
                        duration: 0.6,
                        y: 30,
                        opacity: 0,
                        ease: 'power2.out',
                        delay: i * 0.1
                    });
                });
            }, 100);
        }
        
        // Setup category filter
        function setupCategoryFilter() {
            const filterContainer = document.getElementById('category-filter');
            if (!filterContainer) return;
            
            const categories = ['全部', '城市', '自然', '风景', '人文', '建筑'];
            
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.textContent = category;
                btn.addEventListener('click', () => {
                    // Remove active class from all buttons
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    // Add active class to clicked button
                    btn.classList.add('active');
                    // Filter and render
                    renderPhotography(category);
                });
                
                if (category === '全部') {
                    btn.classList.add('active');
                }
                
                filterContainer.appendChild(btn);
            });
        }
        
        // Modal functions
        function openModal(photoData) {
            const modal = document.getElementById('image-modal');
            const modalImage = document.getElementById('modal-image');
            const modalTitle = document.getElementById('modal-title');
            
            if (modal && modalImage && modalTitle) {
                modalImage.textContent = photoData.image;
                modalTitle.textContent = `${photoData.title} - ${photoData.category} · ${photoData.date}`;
                modal.style.display = 'flex';
            }
        }
        
        function closeModal() {
            const modal = document.getElementById('image-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        // GSAP Animations
        function initGSAPAnimations() {
            gsap.registerPlugin(ScrollTrigger);
            
            // Header animation
            gsap.from('header', {
                duration: 0.8,
                y: -20,
                opacity: 0,
                ease: 'power2.out'
            });
            
            // Filter buttons animation
            gsap.from('.category-filter', {
                scrollTrigger: {
                    trigger: '.category-filter',
                    start: 'top 85%',
                    toggleActions: 'play none none reverse'
                },
                duration: 0.6,
                y: 20,
                opacity: 0,
                ease: 'power2.out'
            });
        }
        
        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('image-modal');
            if (modal && e.target === modal) {
                closeModal();
            }
        });
        
        // Keyboard support for modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>摄影作品</h1>
            <div class="tagline">用镜头记录生活的美好瞬间</div>
        </header>
        
        <!-- Category Filter -->
        <div class="category-filter" id="category-filter">
            <!-- Category buttons will be generated by JavaScript -->
        </div>
        
        <!-- Photography Grid -->
        <div class="photography-grid" id="photography-grid">
            <!-- Photography cards will be generated by JavaScript -->
        </div>
    </div>
    
    <!-- Image Modal -->
    <div class="modal" id="image-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div style="font-size: 8em; text-align: center; margin-bottom: 20px;" id="modal-image"></div>
            <div style="color: white; text-align: center; font-size: 1.2em;" id="modal-title"></div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 Y.B.ZHANG. All rights reserved.</p>
        <p>Powered by GitHub Pages & Jekyll</p>
    </footer>
</body>
</html>
