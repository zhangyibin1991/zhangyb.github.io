<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.active .lightbox-image {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .lightbox-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            background-color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        /* Year Section Styles */
        .year-section {
            max-width: 1200px;
            margin: 40px auto 30px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .year-text {
            font-size: 1.5em;
            color: #222;
            font-weight: 300;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .year-divider {
            flex: 1;
            height: 1px;
            background-color: #eee;
        }

        .qsl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 200px);
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            justify-content: center;
        }

        .qsl-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .qsl-card:nth-child(1) { animation-delay: 0.03s; }
        .qsl-card:nth-child(2) { animation-delay: 0.06s; }
        .qsl-card:nth-child(3) { animation-delay: 0.09s; }
        .qsl-card:nth-child(4) { animation-delay: 0.12s; }
        .qsl-card:nth-child(5) { animation-delay: 0.15s; }
        .qsl-card:nth-child(6) { animation-delay: 0.18s; }
        .qsl-card:nth-child(7) { animation-delay: 0.21s; }
        .qsl-card:nth-child(8) { animation-delay: 0.24s; }
        .qsl-card:nth-child(9) { animation-delay: 0.27s; }
        .qsl-card:nth-child(10) { animation-delay: 0.30s; }
        .qsl-card:nth-child(11) { animation-delay: 0.33s; }
        .qsl-card:nth-child(12) { animation-delay: 0.36s; }
        .qsl-card:nth-child(13) { animation-delay: 0.39s; }

        .qsl-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .qsl-image-container {
            width: 100%;
            padding-bottom: 63.64%; /* 7/11 ≈ 63.64% - 11:7 aspect ratio */
            overflow: hidden;
            background: #f0f0f0;
            position: relative;
        }

        .qsl-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .qsl-card:hover .qsl-image-container img {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式布局 - 卡片宽度固定为200px */
        @media (max-width: 1200px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 200px);
            }
        }

        @media (max-width: 900px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 200px);
            }
        }

        /* 小屏幕设备 - 卡片尺寸缩小到一半 (100px) */
        @media (max-width: 600px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 100px);
                gap: 8px;
            }
            
            .qsl-card {
                border-radius: 6px;
            }
            
            .qsl-image-container {
                padding-bottom: 63.64%; /* 保持11:7比例 */
            }
        }

        /* 超小屏幕设备 - 卡片尺寸缩小到一半 (100px) */
        @media (max-width: 400px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 100px);
                gap: 6px;
            }
        }

        /* Responsive adjustments for QSL cards */
        @media (max-width: 768px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 200px);
            }
        }

        @media (max-width: 600px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 100px);
                gap: 8px;
            }
            
            .qsl-card {
                border-radius: 6px;
            }
            
            .qsl-image-container {
                padding-bottom: 63.64%; /* 保持11:7比例 */
            }
        }

        @media (max-width: 400px) {
            .qsl-grid {
                grid-template-columns: repeat(auto-fill, 100px);
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">×</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="大图">
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <script>
        // Lightbox functionality
        document.addEventListener('DOMContentLoaded', function() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxInfo = document.getElementById('lightboxInfo');
            const cards = document.querySelectorAll('.qsl-card');

            // Open lightbox on card click
            cards.forEach((card, index) => {
                card.addEventListener('click', function() {
                    const img = this.querySelector('img');
                    const src = img.getAttribute('src');
                    const alt = img.getAttribute('alt');
                    
                    // Remove _thumbnail suffix to get full image path
                    const fullSrc = src.replace('_thumbnail', '');
                    
                    // Set lightbox image and info
                    lightboxImage.setAttribute('src', fullSrc);
                    lightboxInfo.textContent = `卡片 ${index + 1} / ${cards.length}`;
                    
                    // Show lightbox
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; // Prevent scrolling
                });
            });

            // Close lightbox on close button
            lightboxClose.addEventListener('click', function() {
                lightbox.classList.remove('active');
                document.body.style.overflow = ''; // Restore scrolling
            });

            // Close lightbox on background click
            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = ''; // Restore scrolling
                }
            });

            // Close lightbox on Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = ''; // Restore scrolling
                }
            });
        });
    </script>
