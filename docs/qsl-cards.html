        /* Minimalist Color Palette - Consistent with main site */
        :root {
            --primary-color: #222;

            min-height: 100%;

        }
        
        /* Navigation Bar Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--background-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            padding: 0 20px;
        }
        
        .nav-list {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-item {
            margin: 0 15px;
        }
        
        .nav-link {
            display: block;
            padding: 25px 0;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-link:hover {
            color: var(--accent-color);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 40px;

        /* Header Section */
        header {
            text-align: center;

        h1 {
            font-size: 2.2em;

        .subtitle {
            font-size: 1em;

        }
        
        /* QSL Card Grid */
        .qsl-section {
            margin-bottom: 60px;
        }
        
        .qsl-section h2 {
            font-size: 1.7em;
            padding-bottom: 15px;
            color: var(--primary-color);
            font-weight: 300;
            letter-spacing: -0.02em;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        .qsl-filters {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-label {
            font-size: 0.95em;
            color: var(--secondary-color);
            font-weight: 500;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg-color);
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        
        .filter-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        
        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        
        .qsl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .qsl-card {
            background: var(--qsl-bg-color);
            border: 1px solid var(--qsl-border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .qsl-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-color);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .qsl-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
        }
        
        .qsl-card:hover::before {
            transform: scaleX(1);
        }
        
        .qsl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--qsl-border-color);
        }
        
        .qsl-call-sign {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--accent-color);
            font-family: 'Courier New', monospace;
        }
        
        .qsl-band {
            background: var(--accent-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;

        .qsl-details {
            font-size: 0.9em;
            color: var(--secondary-color);
            line-height: 1.6;
        }
        
        .qsl-detail-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .qsl-detail-label {
            font-weight: 600;
            color: var(--primary-color);
            min-width: 60px;
            margin-right: 8px;
        }
        
        .qsl-date {
            font-size: 0.85em;
            color: #999;

            text-align: right;
            font-style: italic;
        }
        
        .qsl-mode {
            background: #e8f4fd;
            color: var(--accent-color);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .qsl-rst {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: var(--primary-color);
        }

            text-align: center;

            color: var(--secondary-color);
        }

            }

                grid-template-columns: 1fr;

            .filter-btn {
                padding: 6px 12px;
                font-size: 0.85em;
            }
        }
        
        /* Animation Classes */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
        }
        
        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--secondary-color);
        }
        
        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        // Load QSL data from embedded data
        function loadQSLData() {
            const grid = document.getElementById('qsl-grid');
            
            if (!grid) return;

            // Show loading state
            grid.innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="spinner"></div>
                    <p>正在加载QSL卡片数据...</p>
                </div>
            `;

            // Use embedded data directly
            try {
                // Process and store data
                processQSLData(qslDataEmbedded);
                
                // Render the data
                renderQSLCards();
                
            } catch (error) {
                console.error('Error processing QSL data:', error);
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">❌</div>
                        <h3>数据处理错误</h3>
                        <p>请检查嵌入的数据格式</p>
                        <p style="font-size: 0.85em; color: #999; margin-top: 10px;">错误: ${error.message}</p>
                    </div>
                `;
            }
        }


        // Process QSL data from JSON
        function processQSLData(data) {
            const allCards = [];
            
            // Extract cards from all years
            if (data.years) {
                Object.keys(data.years).forEach(year => {
                    const yearCards = data.years[year];
                    yearCards.forEach(card => {
                        // Create card object with additional fields for display
                        const cardObj = {
                            ...card,
                            year: year,
                            callSign: card.call_sign || card.callSign || extractCallSign(card.filename),
                            band: extractBand(card.filename),
                            mode: extractMode(card.filename),
                            frequency: extractFrequency(card.filename),
                            date: formatDate(card.modified),
                            time: formatTime(card.modified),
                            rstSent: "59",
                            rstRcvd: "59",
                            qth: "未知",
                            remarks: `年份: ${year}`
                        };
                        
                        allCards.push(cardObj);
                    });
                });
            }

            qslData = allCards;
        }

        // Extract call sign from filename
        function extractCallSign(filename) {
            const nameWithoutExt = filename.replace(/\.[^/.]+$/, "");
            const parts = nameWithoutExt.split('_');
            return parts[0] || nameWithoutExt;
        }

        // Extract band from filename (simple heuristic)
        function extractBand(filename) {
            // Try to detect band from filename patterns
            if (filename.includes('20m') || filename.match(/M5/i)) return '20m';
            if (filename.includes('40m')) return '40m';
            if (filename.includes('80m')) return '80m';
            if (filename.includes('15m')) return '15m';
            if (filename.includes('10m')) return '10m';
            if (filename.includes('2m')) return '2m';
            // Default for unknown
            return '20m';
        }

        // Extract mode from filename
        function extractMode(filename) {
            if (filename.includes('SSB') || filename.match(/M5/i)) return 'SSB';
            if (filename.includes('CW')) return 'CW';
            if (filename.includes('FM')) return 'FM';
            if (filename.includes('AM')) return 'AM';
            // Default for unknown
            return 'SSB';
        }

        // Extract frequency from filename
        function extractFrequency(filename) {
            const band = extractBand(filename);
            const freqMap = {
                '20m': '14.250',
                '40m': '7.180',
                '80m': '3.750',
                '15m': '21.250',
                '10m': '28.500',
                '2m': '145.500'
            };
            return freqMap[band] || '14.250';
        }

        // Format timestamp to date string
        function formatDate(timestamp) {
            if (!timestamp) return '未知日期';
            const date = new Date(timestamp * 1000);
            return date.toISOString().split('T')[0];
        }

        // Format timestamp to time string
        function formatTime(timestamp) {
            if (!timestamp) return '未知时间';
            const date = new Date(timestamp * 1000);
            return date.toTimeString().split(' ')[0].substring(0, 5);
        }

        // Render QSL cards with year grouping
        function renderQSLCards() {
            const grid = document.getElementById('qsl-grid');
            if (!grid) return;

            // Filter data
            let filteredData = qslData;
            
            // Apply year filter
            if (currentYearFilter !== 'all') {
                filteredData = filteredData.filter(card => card.year === currentYearFilter);
            }
            
            // Apply other filters
            if (currentFilter !== 'all') {
                filteredData = filteredData.filter(card => {
                    if (currentFilter === 'SSB' || currentFilter === 'CW' || currentFilter === 'FM' || currentFilter === 'AM') {
                        return card.mode === currentFilter;
                    } else {
                        return card.band === currentFilter;
                    }
                });
            }

            if (filteredData.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📻</div>
                        <h3>暂无符合条件的卡片</h3>
                        <p>请尝试其他筛选条件</p>
                    </div>
                `;
                return;
            }

            // Group by year
            const groupedByYear = {};
            filteredData.forEach(card => {
                if (!groupedByYear[card.year]) {
                    groupedByYear[card.year] = [];
                }
                groupedByYear[card.year].push(card);
            });

            // Generate HTML
            let html = '';
            const years = Object.keys(groupedByYear).sort().reverse();
            
            years.forEach(year => {
                const yearCards = groupedByYear[year];
                
                // Year header
                html += `
                    <div class="year-header" style="grid-column: 1 / -1; margin-top: 30px; margin-bottom: 15px;">
                        <h3 style="color: var(--accent-color); font-size: 1.3em; font-weight: 600; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px;">
                            ${year} 年 (${yearCards.length} 张)
                        </h3>
                    </div>
                `;
                
                // Cards for this year
                yearCards.forEach((card, index) => {
                    // Create a unique ID for the image container
                    const imgId = `img-${year}-${index}`;
                    
                    html += `
                        <div class="qsl-card fade-in" style="animation-delay: ${index * 0.03}s">
                            <div class="qsl-header">
                                <div class="qsl-call-sign">${card.callSign}</div>
                                <div class="qsl-band">${card.band}</div>
                            </div>
                            <div class="qsl-image-container" style="margin-bottom: 15px; border-radius: 4px; overflow: hidden; background: #f0f0f0; min-height: 150px; display: flex; align-items: center; justify-content: center;">
                                <img id="${imgId}" 
                                     src="${card.path}" 
                                     alt="${card.callSign}" 
                                     style="max-width: 100%; height: auto;"
                                     onload="document.getElementById('${imgId}-loading').style.display='none';"
                                     onerror="this.style.display='none'; document.getElementById('${imgId}-loading').innerHTML='图片加载失败';">
                                <div id="${imgId}-loading" style="color: #999; font-size: 0.9em;">加载中...</div>
                            </div>
                            <div class="qsl-details">
                                <div class="qsl-detail-item">
                                    <span class="qsl-detail-label">频率:</span>
                                    <span>${card.frequency} MHz</span>
                                </div>
                                <div class="qsl-detail-item">
                                    <span class="qsl-detail-label">模式:</span>
                                    <span class="qsl-mode">${card.mode}</span>
                                </div>
                                <div class="qsl-detail-item">
                                    <span class="qsl-detail-label">文件:</span>
                                    <span style="font-size: 0.85em; color: #666;">${card.filename}</span>
                                </div>
                            </div>
                            <div class="qsl-date">${card.date} ${card.time}</div>
                        </div>
                    `;
                });
            });

            grid.innerHTML = html;

            // Re-trigger animations for new content
            setTimeout(() => {
                initCardAnimations();
            }, 100);
        }

        // Initialize filters
        function initFilters() {
            // Year filter buttons
            const yearFilterContainer = document.createElement('div');
            yearFilterContainer.className = 'qsl-filters';
            yearFilterContainer.innerHTML = `
                <span class="filter-label">年份:</span>
                <button class="filter-btn active" data-year="all">全部</button>
            `;
            
            // Add year buttons dynamically based on available years
            const years = [...new Set(qslData.map(c => c.year))].sort().reverse();
            years.forEach(year => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = year;
                btn.setAttribute('data-year', year);
                yearFilterContainer.appendChild(btn);
            });

            // Insert before existing filters
            const existingFilters = document.querySelector('.qsl-filters');
            if (existingFilters && existingFilters.parentNode) {
                existingFilters.parentNode.insertBefore(yearFilterContainer, existingFilters);
            }

            // Band/Mode filter buttons
            const filterButtons = document.querySelectorAll('.filter-btn[data-filter]');
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Update active state
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update filter state
                    currentFilter = this.getAttribute('data-filter');
                    
                    // Re-render cards
                    renderQSLCards();
                });
            });

            // Year filter buttons (delegated event)
            document.addEventListener('click', function(e) {
                if (e.target.hasAttribute('data-year')) {
                    const yearButtons = document.querySelectorAll('.filter-btn[data-year]');
                    yearButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentYearFilter = e.target.getAttribute('data-year');
                    renderQSLCards();
                }
            });
        }

        // Initialize GSAP animations
        function initAnimations() {
            // Register ScrollTrigger
            if (typeof gsap !== 'undefined' && gsap.registerPlugin) {
                gsap.registerPlugin(ScrollTrigger);

                // Header animation
                gsap.from('header', {
                    duration: 0.8,
                    y: -20,
                    opacity: 0,
                    ease: 'power2.out'
                });

                // QSL section animation
                gsap.from('.qsl-section', {
                    scrollTrigger: {
                        trigger: '.qsl-section',
                        start: 'top 85%',
                        toggleActions: 'play none none reverse'
                    },
                    duration: 0.6,
                    y: 30,
                    opacity: 0,
                    ease: 'power2.out'
                });
            }
        }

        // Initialize card animations
        function initCardAnimations() {
            if (typeof gsap === 'undefined') return;
            
            const cards = document.querySelectorAll('.qsl-card');
            
            cards.forEach((card, index) => {
                gsap.from(card, {
                    scrollTrigger: {
                        trigger: card,
                        start: 'top 90%',
                        toggleActions: 'play none none reverse'
                    },
                    duration: 0.5,
                    y: 30,
                    opacity: 0,
                    ease: 'power2.out',
                    delay: index * 0.03
                });
            });
        }


        // Add ripple effect to filter buttons
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('filter-btn') && !e.target.disabled) {
                    const ripple = document.createElement('span');
                    const rect = e.target.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        left: ${x}px;
                        top: ${y}px;
                        background: rgba(255,255,255,0.3);
                        border-radius: 50%;
                        transform: scale(0);
                        animation: ripple 0.6s ease-out;
                        pointer-events: none;
                    `;
                    
                    e.target.style.position = 'relative';
                    e.target.style.overflow = 'hidden';
                    e.target.appendChild(ripple);
                    
                    setTimeout(() => ripple.remove(), 600);
                }
            });

            // Add ripple animation to styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(2);
                        opacity: 0;
                    }
                }
                .year-header {
                    animation: fadeIn 0.5s ease-out;
                }
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(-10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
